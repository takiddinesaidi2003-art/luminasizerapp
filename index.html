  <body>
    <div id="root"></div>
    <!-- Fallback: show error if React doesn't mount after 5s -->
    <div id="loading-fallback" style="display:none;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;gap:16px;padding:24px;text-align:center;">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <h2 style="font-size:20px;font-weight:bold;color:#1f2937;margin:0">خطأ في تحميل التطبيق</h2>
      <p id="fallback-msg" style="color:#6b7280;margin:0;font-size:14px">يرجى مسح كاش المتصفح وإعادة التحميل</p>
      <button onclick="clearAndReload()" style="background:#10b981;color:white;border:none;padding:10px 24px;border-radius:8px;font-size:14px;cursor:pointer;">مسح الكاش وإعادة التحميل</button>
    </div>
    <script>
      async function clearAndReload() {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
        window.location.reload(true);
      }
      // If React doesn't mount within 5 seconds, show fallback
      setTimeout(function() {
        const root = document.getElementById('root');
        if (root && root.children.length === 0) {
          document.getElementById('loading-fallback').style.display = 'flex';
        }
      }, 5000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (async function initServiceWorker() {
        if (!('serviceWorker' in navigator)) return;

        const isDev =
          location.hostname === 'localhost' ||
          location.hostname === '127.0.0.1';

        if (isDev) {
          // Dev: aggressively unregister any stale SW and clear all caches
          try {
            const regs = await navigator.serviceWorker.getRegistrations();
            if (regs.length > 0) {
              await Promise.all(regs.map(r => r.unregister()));
              const keys = await caches.keys();
              await Promise.all(keys.map(k => caches.delete(k)));
              window.location.reload();
            }
          } catch (e) {
            console.warn('[SW] Dev cleanup failed:', e);
          }
          return;
        }

        // Production: register SW
        try {
          const reg = await navigator.serviceWorker.register('/sw.js', {
            // Always check for SW updates on page load
            updateViaCache: 'none',
          });

          // If a new SW is waiting, activate it immediately on next navigation
          reg.addEventListener('updatefound', () => {
            const newSW = reg.installing;
            if (!newSW) return;
            newSW.addEventListener('statechange', () => {
              if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
                // New SW ready — send skip-waiting so it activates now
                newSW.postMessage({ type: 'SKIP_WAITING' });
              }
            });
          });

          // Reload page when SW takes control (after update)
          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });

          console.log('[SW] Registered:', reg.scope);
        } catch (err) {
          console.warn('[SW] Registration failed:', err);
        }
      })();
    </script>
  </body>
